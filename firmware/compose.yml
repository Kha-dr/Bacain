services:
  firmware:
    image: espressif/idf:v5.3.1
    container_name: bacain-firmware-builder
    working_dir: /project/firmware
    volumes:
      - ..:/project
    command: >
      bash -c "idf.py -B /project/build set-target esp32s3 && idf.py -B /project/build build && python3 package_firmware.py /project/build"
