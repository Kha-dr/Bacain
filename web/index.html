<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BacaIn</title>
  <meta name="description" content="Web Bluetooth book sync and reader manager for ESP32-S3 BacaIn">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BacaIn">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <!-- E-Book Ingestion Processors -->
  <script src="processors/text-cleaner.js" defer></script>
  <script src="processors/epub-processor.js" defer></script>
  <script src="processors/fb2-processor.js" defer></script>

  <!-- Web Components Scripts -->
  <script src="components/status-dashboard.js" defer></script>
  <script src="components/book-library.js" defer></script>
  <script src="components/book-uploader.js" defer></script>
  <script src="components/device-settings-modal.js" defer></script>
</head>
<body>
  <div class="app-container">

    <!-- Header Section -->
    <header class="app-header">
      <div class="brand-section">
        <img src="icon.svg" alt="BacaIn Logo" class="brand-logo">
        <div class="brand-text">
          <h1>BacaIn</h1>
          <p>E-Paper Reader Manager</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- BLE Connection Button -->
        <button id="connectBtn" class="btn-connect">
          <span id="statusDot" class="status-dot disconnected"></span>
          <span id="connectBtnText">Connect BacaIn</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
            <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"></path>
          </svg>
        </button>

        <!-- Settings Modal Trigger Button -->
        <button id="settingsBtn" class="btn-icon" aria-label="Open Settings" title="Settings & Hardware Configuration">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Browser Incompatibility Banner (hidden by default) -->
    <div id="compatBanner" class="alert-banner alert-warning" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div>
        <strong>Web Bluetooth Not Supported:</strong> Your current browser does not support the Web Bluetooth API.
        Please open this application in <strong>Google Chrome</strong>, <strong>Microsoft Edge</strong>, or <strong>Bluefy (iOS)</strong> over HTTPS or localhost.
      </div>
    </div>

    <!-- MAIN DASHBOARD & MANAGER SEQUENCE -->
    <main class="app-main-content">
      <status-dashboard id="statusDashboard"></status-dashboard>
      <book-library id="bookLibrary"></book-library>
      <book-uploader id="bookUploader"></book-uploader>
    </main>

  </div>

  <!-- Device Settings Modal Web Component -->
  <device-settings-modal id="settingsModal"></device-settings-modal>

  <!-- Delete Book Confirmation Modal -->
  <div id="deleteModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 class="modal-title">Delete Book</h3>
      <p id="deleteModalText" class="modal-desc">Are you sure you want to delete this book from your BacaIn?</p>
      <div class="modal-actions">
        <button id="cancelDeleteBtn" class="btn-secondary">Cancel</button>
        <button id="confirmDeleteBtn" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- PWA Main Logic -->
  <script src="app.js" defer></script>
</body>
</html>
