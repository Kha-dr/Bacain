name: Firmware Builder

on:
  push:
    branches:
      - main
    paths:
      - "firmware/**"
      - ".github/workflows/firmware_ci.yml"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - "firmware/**"
      - ".github/workflows/firmware_ci.yml"
  workflow_dispatch:
    inputs:
      board_id:
        description: "Board ID to build"
        required: true
        default: "waveshare_154"
        type: string
      flash_size:
        description: "Flash size (4MB, 8MB, 16MB, 32MB)"
        required: true
        default: "8MB"
        type: string
      extra_idf_args:
        description: "Extra IDF Build Args / Compiler Macros"
        required: true
        default: "-DBOARD_PROFILE=waveshare_154"
        type: string
      output_bin:
        description: "Output Factory Binary Name"
        required: true
        default: "bacain_waveshare_154.bin"
        type: string

permissions:
  contents: write

jobs:
  prepare-matrix:
    name: Generate Board Target
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      INPUT_BOARD_ID: ${{ inputs.board_id }}
      INPUT_FLASH_SIZE: ${{ inputs.flash_size }}
      INPUT_EXTRA_ARGS: ${{ inputs.extra_idf_args }}
      INPUT_OUTPUT_BIN: ${{ inputs.output_bin }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
      - name: Parse boards.json
        id: set-matrix
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MATRIX_JSON=$(jq -nc --arg id "$INPUT_BOARD_ID" --arg fsize "$INPUT_FLASH_SIZE" --arg args "$INPUT_EXTRA_ARGS" --arg bin "$INPUT_OUTPUT_BIN" '[{id: $id, chip: "esp32s3", flash_size: $fsize, output_bin: $bin, extra_args: $args}]')
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            MATRIX_JSON=$(jq -c '[.boards[] | {id: .id, name: .name, chip: .chip, flash_size: .flash_size, output_bin: .output_bin, extra_args: (.extra_idf_args // ("-DBOARD_PROFILE=" + .id))}]' firmware/boards/boards.json)
          else
            MATRIX_JSON=$(jq -c '[.boards[] | select(.id == "waveshare_154") | {id: .id, name: .name, chip: .chip, flash_size: .flash_size, output_bin: .output_bin, extra_args: (.extra_idf_args // ("-DBOARD_PROFILE=" + .id))}]' firmware/boards/boards.json)
          fi
          echo "matrix={\"board\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Package Firmware (${{ matrix.board.id }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      BOARD_ID: ${{ matrix.board.id }}
      CHIP_TARGET: ${{ matrix.board.chip || 'esp32s3' }}
      FLASH_SIZE: ${{ inputs.flash_size || matrix.board.flash_size || '8MB' }}
      EXTRA_IDF_ARGS: ${{ inputs.extra_idf_args || matrix.board.extra_args }}
      FACTORY_BIN: ${{ inputs.output_bin || matrix.board.output_bin }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Firmware
        working-directory: firmware
        run: |
          if [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          fi
          idf.py ${EXTRA_IDF_ARGS} set-target "${CHIP_TARGET}"
          idf.py ${EXTRA_IDF_ARGS} build

      - name: Resolve Version and Binary Name
        id: resolve-bin
        if: github.event_name != 'pull_request'
        working-directory: firmware
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "${GITHUB_SHA::7}")"
          fi
          BASE_BIN="${FACTORY_BIN}"
          if [[ "${BASE_BIN}" == *.bin ]]; then
            TARGET_BIN="${BASE_BIN%.bin}_${VERSION}.bin"
          else
            TARGET_BIN="${BASE_BIN}_${VERSION}.bin"
          fi
          echo "target_bin=${TARGET_BIN}" >> "$GITHUB_OUTPUT"
          echo "TARGET_BIN=${TARGET_BIN}" >> "$GITHUB_ENV"

      - name: Merge Factory Binary
        if: github.event_name != 'pull_request'
        working-directory: firmware
        run: |
          if [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          fi

          python3 package_firmware.py -o "${TARGET_BIN}" --chip "${CHIP_TARGET}" --board "${BOARD_ID}" --flash-size "${FLASH_SIZE}"

      - name: Upload Build Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bacain-firmware-${{ matrix.board.id }}
          path: |
            firmware/build/${{ steps.resolve-bin.outputs.target_bin }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/build/${{ steps.resolve-bin.outputs.target_bin }}
          generate_release_notes: true
