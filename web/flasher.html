<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BacaIn Flasher</title>
  <meta name="description" content="ESP32-S3 firmware installer for BacaIn">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    .custom-file-details {
      margin-top: 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      transition: border-color var(--transition-fast);
    }

    .custom-file-details:hover {
      border-color: var(--border-hover);
    }

    .custom-file-summary {
      padding: 0.65rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .custom-file-summary:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: -2px;
      border-radius: var(--radius-sm);
    }

    .custom-file-content {
      padding: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .release-select-group {
      margin-bottom: 0.85rem;
    }

    .release-select-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }

    .release-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.65rem 0.75rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
    }

    .release-meta-item .meta-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .release-meta-item .meta-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    .release-meta-item .meta-mono {
      font-family: var(--font-mono);
      color: var(--text-secondary);
    }
  </style>
  <script src="config.js" defer></script>
  <script>
    const savedTheme = localStorage.getItem('bacain_theme') || localStorage.getItem('ereader_pwa_theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
    window.addEventListener('DOMContentLoaded', () => {
      const githubBtn = document.getElementById('githubBtn');
      if (githubBtn && window.CONFIG?.repo) {
        githubBtn.href = window.CONFIG.repo;
      }
    });
  </script>
</head>

<body>
  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="brand-section">
        <img src="assets/icon.svg" alt="BacaIn logo" class="brand-logo">
        <div class="brand-text">
          <h1><span>Baca<span style="color: var(--accent-color);">In</span></span> <span
              class="brand-badge">Flasher</span></h1>
          <p>ESP32-S3 firmware installer</p>
        </div>
      </div>

      <div class="header-actions">
        <a id="githubBtn" href="https://github.com/Kha-dr/BacaIn" target="_blank" rel="noopener noreferrer"
          class="btn-icon" aria-label="GitHub repository" title="GitHub repository">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
            </path>
          </svg>
        </a>
        <a href="index.html" class="btn-secondary"
          style="display:inline-flex;align-items:center;gap:0.5rem;text-decoration:none;padding:0.6rem 1rem;font-size:0.9rem;font-weight:600;border-radius:var(--radius-md);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" style="width:16px;height:16px;">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Dashboard</span>
        </a>
      </div>
    </header>

    <!-- Main Flasher Content -->
    <main id="main-content" role="main">
      <esp-web-flasher id="espFlasher"></esp-web-flasher>
    </main>
  </div>

  <!-- ESP Web Flasher Web Component Module -->
  <script type="module" src="components/esp-flasher.js"></script>
</body>

</html>
