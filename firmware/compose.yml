services:
  firmware:
    image: espressif/idf:v5.3.1
    container_name: bacain-firmware-builder
    working_dir: /project/firmware
    environment:
      - BOARD=${BOARD:-${BOARD_NAME:-waveshare_154}}
      - EXTRA_IDF_ARGS=${EXTRA_IDF_ARGS:-}
      - FACTORY_BIN=${FACTORY_BIN:-}
    volumes:
      - ..:/project
    command: python3 package_firmware.py /project/build --build

  clean-build:
    image: espressif/idf:v5.3.1
    container_name: bacain-firmware-clean-builder
    working_dir: /project/firmware
    environment:
      - BOARD=${BOARD:-${BOARD_NAME:-waveshare_154}}
      - EXTRA_IDF_ARGS=${EXTRA_IDF_ARGS:-}
      - FACTORY_BIN=${FACTORY_BIN:-}
    volumes:
      - ..:/project
    command: python3 package_firmware.py /project/build --build --clean

  flash:
    image: espressif/idf:v5.3.1
    container_name: bacain-firmware-flasher
    working_dir: /project/firmware
    privileged: true
    environment:
      - ESP_PORT=${ESP_PORT:-/dev/ttyACM0}
    volumes:
      - ..:/project
    command: >
      bash -c "idf.py -B /project/build -p $${ESP_PORT} flash"
