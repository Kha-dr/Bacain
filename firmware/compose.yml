services:
  firmware:
    image: espressif/idf:v5.3.1
    container_name: bacain-firmware-builder
    working_dir: /project/firmware
    environment:
      - EXTRA_IDF_ARGS=${EXTRA_IDF_ARGS:-}
      - FACTORY_BIN=${FACTORY_BIN:-bacain_factory.bin}
      - BOARD_NAME=${BOARD_NAME:-Waveshare ESP32-S3-ePaper-1.54}
    volumes:
      - ..:/project
    command: >
      bash -c "idf.py -B /project/build set-target esp32s3 && idf.py -B /project/build build $${EXTRA_IDF_ARGS} && python3 package_firmware.py /project/build -o \"$${FACTORY_BIN}\" --board \"$${BOARD_NAME}\""
