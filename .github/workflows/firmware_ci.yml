name: BacaIn Firmware CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      board_name:
        description: 'Board Profile Name'
        required: false
        default: ''
        type: string
      extra_idf_args:
        description: 'Extra IDF Build Args / Compiler Macros (e.g. -DCONFIG_BOARD_DISPLAY_WIDTH=250)'
        required: false
        default: ''
        type: string
      output_bin:
        description: 'Output Factory Binary Name'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare-matrix:
    name: Generate Board Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Parse boards.json
        id: set-matrix
        run: |
          MATRIX_JSON=$(jq -c '[.boards[] | {id: .id, name: .name, output_bin: .output_bin, extra_args: ("-DCONFIG_BOARD_PROFILE_" + (.id | ascii_upcase) + "=y")}]' firmware/boards/boards.json)
          echo "matrix={\"board\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Package BacaIn ESP32-S3 Firmware (${{ matrix.board.id }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      BOARD_NAME: ${{ inputs.board_name || matrix.board.name }}
      EXTRA_IDF_ARGS: ${{ inputs.extra_idf_args || matrix.board.extra_args }}
      FACTORY_BIN: ${{ inputs.output_bin || matrix.board.output_bin }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Firmware
        working-directory: firmware
        run: |
          if [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          fi
          idf.py set-target esp32s3
          idf.py build ${EXTRA_IDF_ARGS}

      - name: Merge Factory Binary & Generate Manifest
        working-directory: firmware
        run: |
          if [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          fi

          # Standardize binary paths from ESP-IDF build output
          if [ -f build/bacain.bin ] && [ ! -f build/reader_firmware.bin ]; then
            cp build/bacain.bin build/reader_firmware.bin
          elif [ -f build/mini_e_reader.bin ] && [ ! -f build/reader_firmware.bin ]; then
            cp build/mini_e_reader.bin build/reader_firmware.bin
          fi

          if [ -f build/bootloader/bootloader.bin ] && [ ! -f build/bootloader.bin ]; then
            cp build/bootloader/bootloader.bin build/bootloader.bin
          fi

          if [ -f build/partition_table/partition-table.bin ] && [ ! -f build/partition-table.bin ]; then
            cp build/partition_table/partition-table.bin build/partition-table.bin
          fi

          python3 package_firmware.py -o "${FACTORY_BIN}" --board "${BOARD_NAME}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bacain-firmware-${{ matrix.board.id }}
          path: |
            firmware/build/${{ env.FACTORY_BIN }}
            firmware/build/reader_firmware.bin
            firmware/build/bootloader.bin
            firmware/build/partition-table.bin
            firmware/build/manifest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/build/${{ env.FACTORY_BIN }}
            firmware/build/reader_firmware.bin
            firmware/build/bootloader.bin
            firmware/build/partition-table.bin
            firmware/build/manifest.json
          generate_release_notes: true
