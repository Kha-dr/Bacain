name: Firmware Builder

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      board_id:
        description: "Board ID from boards.json"
        required: true
        default: "waveshare_154"
        type: string
      extra_idf_args:
        description: "Extra IDF Build Args / Compiler Macros"
        required: true
        default: "-DCONFIG_BOARD_PROFILE_WAVESHARE_154=y"
        type: string
      output_bin:
        description: "Output Factory Binary Name"
        required: true
        default: "bacain_waveshare_154_factory.bin"
        type: string

permissions:
  contents: write

jobs:
  prepare-matrix:
    name: Generate Board Target
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_BOARD_ID: ${{ inputs.board_id }}
      INPUT_EXTRA_ARGS: ${{ inputs.extra_idf_args }}
      INPUT_OUTPUT_BIN: ${{ inputs.output_bin }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
      - name: Parse boards.json
        id: set-matrix
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MATRIX_JSON=$(jq -nc --arg id "$INPUT_BOARD_ID" --arg args "$INPUT_EXTRA_ARGS" --arg bin "$INPUT_OUTPUT_BIN" '[{id: $id, chip: "esp32s3", flash_size: "8MB", output_bin: $bin, extra_args: $args}]')
          else
            MATRIX_JSON=$(jq -c '[.boards[] | {id: .id, name: .name, chip: .chip, flash_size: .flash_size, output_bin: .output_bin, extra_args: ("-DCONFIG_BOARD_PROFILE_" + (.id | ascii_upcase) + "=y")}]' firmware/boards/boards.json)
          fi
          echo "matrix={\"board\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Package Firmware (${{ matrix.board.id }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      CHIP_TARGET: ${{ matrix.board.chip || 'esp32s3' }}
      FLASH_SIZE: ${{ matrix.board.flash_size || '8MB' }}
      EXTRA_IDF_ARGS: ${{ inputs.extra_idf_args || matrix.board.extra_args }}
      FACTORY_BIN: ${{ inputs.output_bin || matrix.board.output_bin }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Firmware
        working-directory: firmware
        run: |
          if [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          fi
          idf.py set-target "${CHIP_TARGET}"
          idf.py build ${EXTRA_IDF_ARGS}

      - name: Merge Factory Binary
        if: github.event_name != 'pull_request'
        working-directory: firmware
        run: |
          if [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          fi

          python3 package_firmware.py -o "${FACTORY_BIN}" --chip "${CHIP_TARGET}" --flash-size "${FLASH_SIZE}"

      - name: Upload Build Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bacain-firmware-${{ matrix.board.id }}
          path: |
            firmware/build/${{ env.FACTORY_BIN }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/build/${{ env.FACTORY_BIN }}
          generate_release_notes: true
